<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WordEase</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 380px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    /* Header */
    .header {
      padding: 20px 20px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header h3 { font-size: 18px; font-weight: 700; }

    .count-pill {
      background: rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      padding: 4px 11px;
      font-size: 12px;
      font-weight: 600;
    }

    /* Search */
    .search-wrap { padding: 12px 20px 0; }

    #search {
      width: 100%;
      padding: 9px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.15);
      color: white;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: background 0.2s;
    }

    #search::placeholder { color: rgba(255, 255, 255, 0.5); }
    #search:focus { background: rgba(255, 255, 255, 0.25); }

    /* History list */
    #history {
      max-height: 320px;
      overflow-y: auto;
      padding: 12px 20px 0;
    }

    #history::-webkit-scrollbar { width: 4px; }
    #history::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
    }

    .history-empty, .no-match {
      text-align: center;
      padding: 36px 20px;
      color: rgba(255, 255, 255, 0.55);
      font-style: italic;
      font-size: 13px;
      line-height: 1.6;
    }

    .item {
      background: rgba(255, 255, 255, 0.13);
      border: 1px solid rgba(255, 255, 255, 0.17);
      border-radius: 14px;
      padding: 11px 13px;
      margin-bottom: 9px;
      cursor: pointer;
      transition: all 0.18s;
    }

    .item:hover {
      background: rgba(255, 255, 255, 0.22);
      transform: translateY(-1px);
    }

    .item-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .item-texts { flex: 1; overflow: hidden; }

    .original {
      font-weight: 600;
      font-size: 14px;
      color: white;
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .translated {
      color: rgba(255, 255, 255, 0.75);
      font-size: 13px;
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-top: 2px;
    }

    .item-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
      flex-shrink: 0;
    }

    .lang-tag {
      font-size: 10px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      padding: 2px 7px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .time {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.45);
      font-family: monospace;
    }

    .copy-hint {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.35);
      margin-top: 5px;
    }

    /* Footer */
    .footer {
      padding: 14px 20px 20px;
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.18s;
    }

    #clear {
      background: rgba(255, 85, 85, 0.85);
      color: white;
    }
    #clear:hover:not(:disabled) {
      background: rgba(255, 85, 85, 1);
      transform: translateY(-1px);
    }

    #export {
      background: rgba(255, 255, 255, 0.18);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    #export:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.28);
      transform: translateY(-1px);
    }

    .btn:disabled { opacity: 0.38; cursor: not-allowed; }

    .loading {
      text-align: center;
      padding: 40px 20px;
      color: rgba(255, 255, 255, 0.55);
    }
  </style>
</head>
<body>
  <div class="header">
    <h3>📜 Translations</h3>
    <span class="count-pill" id="count-pill">0 saved</span>
  </div>

  <div class="search-wrap">
    <input type="text" id="search" placeholder="🔍 Search history…" autocomplete="off">
  </div>

  <div id="history">
    <div class="loading">Loading…</div>
  </div>

  <div class="footer">
    <button class="btn" id="clear"  disabled>🗑️ Clear All</button>
    <button class="btn" id="export" disabled>⬇️ Export JSON</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
